
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - University Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container mt-5">
    <div class="form-box">
        <h2 class="text-center">Create Account</h2>

        <form id="registerForm">
            <input type="text" id="name" class="form-control mb-3"
                   placeholder="Full Name" required>

            <input type="email" id="email" class="form-control mb-3"
                   placeholder="Email" required>

            <input type="password" id="password" class="form-control mb-3"
                   placeholder="Password (minimum 8 characters)" required>

            <select id="role_id" class="form-select mb-3" required>
                <option value="">Select Role</option>
                <option value="1">Student</option>
                <option value="2">Instructor</option>
            </select>

            <button class="btn btn-primary w-100">Register</button>
        </form>

        <p id="message" class="mt-3 text-center"></p>

        <p class="text-center">
            Already registered?
            <a href="/login">Login</a>
        </p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
