
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">University Helpdesk</span>
    <button class="btn btn-light" onclick="logout()">Logout</button>
</nav>

<div class="container mt-4">
    <h2>Student Dashboard</h2>
    <p>Welcome to University Helpdesk</p>

    <div class="card p-4 mb-4">
        <h4>Create New Ticket</h4>

        <form id="ticketForm">
            <input type="text" id="subject" class="form-control mb-3"
                   placeholder="Ticket Subject" required>

            <textarea id="description" class="form-control mb-3"
                      placeholder="Describe your issue" required></textarea>

            <select id="category_id" class="form-select mb-3" required>
                <option value="">Select Category</option>
                <option value="1">Financial Aid</option>
                <option value="2">Registration</option>
                <option value="3">IT</option>
                <option value="4">Accessibility</option>
            </select>

            <select id="priority" class="form-select mb-3">
                <option value="Normal">Normal</option>
                <option value="Low">Low</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
            </select>

            <button class="btn btn-primary">Submit Ticket</button>
        </form>
        <p id="ticketMessage" class="mt-3"></p>
    </div>

    <h4>My Tickets</h4>
    <button class="btn btn-success mb-3" onclick="loadTickets()">
        View My Tickets
    </button>

    <div id="ticketList"></div>

    <a href="/knowledge-base" class="btn btn-outline-primary mt-3">
        Search University Policies
    </a>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
